<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>XstepPulse 3D - Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <meta name="theme-color" content="#0d1117">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="icon" href="./assets/logo.png">
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col relative overflow-hidden select-none h-screen w-screen">

    <div id="canvas-container"></div>

    <!-- Header -->
    <header class="w-full px-6 py-4 flex justify-between items-center z-20 glass-panel border-b border-slate-800 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center">
                <div class="w-2.5 h-2.5 rounded-sm bg-emerald-400"></div>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-wider text-slate-100 uppercase">
                    Xstep<span class="text-emerald-400">Pulse</span>
                    <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-emerald-950/80 text-emerald-400 border border-emerald-800/50 ml-1">3D</span>
                </h1>
                <div id="realTimeClock" class="text-[11px] font-mono text-slate-400 tracking-widest mt-0.5">--:--:--</div>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <div id="offlineIndicator" class="hidden px-2.5 py-1 rounded-full text-[10px] font-mono font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                OFFLINE
            </div>
        </div>
    </header>

    <!-- Main Viewport Area (Data Logs Only) -->
    <main class="flex-1 relative z-10 overflow-hidden flex flex-col">
        
        <!-- Dashboard / Data Logs View -->
        <div id="viewDashboard" class="w-full h-full p-6 md:p-10 overflow-y-auto bg-slate-950/90 z-30 custom-scrollbar">
            <div class="max-w-4xl mx-auto">
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                    <div>
                        <h2 class="text-xl font-mono font-bold text-slate-100 uppercase tracking-wide">Recorded Session Logs</h2>
                        <p class="text-xs text-slate-400 font-mono mt-1">History of tracked steps and system metrics</p>
                    </div>
                    <button id="clearHistoryBtn" class="text-xs font-mono text-rose-400 hover:text-rose-300 border border-rose-950 hover:border-rose-800 px-3 py-1.5 rounded-md transition-colors uppercase">
                        Purge Logs
                    </button>
                </div>
                
                <ul id="historyList" class="space-y-3 pb-20">
                    <!-- Session log items render dynamically here -->
                </ul>
            </div>
        </div>

    </main>

    <!-- Confirmation Modal -->
    <div id="customModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-sm w-full shadow-2xl">
            <h3 id="modalTitle" class="text-slate-100 font-mono text-base font-bold mb-2">Confirm Action</h3>
            <p id="modalMessage" class="text-slate-400 text-xs mb-6 leading-relaxed">Are you sure you want to proceed with this operation?</p>
            <div class="flex gap-3 justify-end">
                <button id="modalCancel" class="px-4 py-2 rounded-lg text-xs font-mono uppercase font-bold text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition-colors">Cancel</button>
                <button id="modalConfirm" class="px-4 py-2 rounded-lg text-xs font-mono uppercase font-bold bg-emerald-500 text-slate-950 hover:bg-emerald-400 transition-colors">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 right-0 m-4 transform translate-x-full transition-transform duration-300 z-50">
        <div class="bg-slate-900 border border-slate-800 border-l-4 border-l-emerald-400 text-slate-100 px-5 py-3.5 rounded-lg shadow-2xl flex items-center gap-3 backdrop-blur">
            <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
            <div>
                <h4 id="toastTitle" class="font-mono font-bold text-xs uppercase">Notification</h4>
                <p id="toastMessage" class="text-xs text-slate-400">Action executed successfully.</p>
            </div>
        </div>
    </div>

    <script src="js/index.js"></script>
    <script>
        // Real-time Clock
        function updateClock() {
            const clockEl = document.getElementById('realTimeClock');
            if (clockEl) {
                const now = new Date();
                clockEl.textContent = now.toTimeString().split(' ')[0];
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Offline status handling
        function updateOnlineStatus() {
            const offlineBadge = document.getElementById('offlineIndicator');
            if (offlineBadge) {
                if (navigator.onLine) {
                    offlineBadge.classList.add('hidden');
                } else {
                    offlineBadge.classList.remove('hidden');
                }
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // Service Worker for offline availability
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered:', reg.scope))
                    .catch(err => console.error('SW Registration Failed:', err));
            });
        }
    </script>
</body>
</html>
